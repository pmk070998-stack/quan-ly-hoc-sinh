<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạnh Khang Digital - AI Attendance</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --primary: #00ffcc; --bg: #0a0a0a; --card: #1c1c1c; --danger: #ff4d4d; --success: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 12px; color: #888; }
        .camera-wrapper { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border: 3px solid #333; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); }
        
        .input-section { margin-top: 25px; text-align: center; }
        input[type="text"] { 
            width: 80%; padding: 18px; background: #000; border: 2px solid var(--primary); 
            color: var(--primary); border-radius: 12px; font-size: 24px; text-align: center; font-weight: bold;
        }
        
        .alert-box { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; font-weight: bold; text-align: center; }
        .alert-danger { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .alert-success { background: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid var(--success); }

        .log-table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        .log-table th { text-align: left; color: #555; padding: 10px; border-bottom: 2px solid #333; }
        .log-table td { padding: 15px 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <div class="status-bar">
            <span id="ai-status">Đang tải bộ não AI...</span>
            <span id="device-info">Studio Mạnh Khang Professional</span>
        </div>
        
        <h2 style="text-align: center; color: var(--primary); margin: 0 0 20px; letter-spacing: 2px;">HỆ THỐNG ĐIỂM DANH AI</h2>
        
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <div id="loading-overlay" style="position:absolute; color:white; font-size:12px;">Đang quét mặt...</div>
        </div>

        <div class="input-section">
            <input type="text" id="studentCode" placeholder="NHẬP SỐ BÁO DANH" autofocus inputmode="numeric">
            <div id="msgBox" class="alert-box"></div>
        </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
        <h3>NHẬT KÝ ĐIỂM DANH TRỰC TUYẾN</h3>
        <table class="log-table">
            <thead>
                <tr><th>STT</th><th>HỌ TÊN</th><th>THỜI GIAN</th><th>TRẠNG THÁI</th></tr>
            </thead>
            <tbody id="logList"></tbody>
        </table>
    </div>
</div>

<script>
    const danhSachLop = ["Phan Mạnh Khang", "Nguyễn Văn A", "Phạm Bá Gia Minh"]; // Anh thêm tiếp ở đây
    const students = {};
    let isAiReady = false;

    // 1. TẢI MODELS AI
    async function loadAI() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        isAiReady = true;
        document.getElementById('ai-status').innerText = "AI SẴN SÀNG ✅";
        startCamera();
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        document.getElementById('video').srcObject = stream;
    }

    // 2. HÀM ĐỌC TÊN (GIỌNG NÓI)
    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        window.speechSynthesis.speak(msg);
    }

    // 3. XỬ LÝ ĐIỂM DANH
    const input = document.getElementById('studentCode');
    input.addEventListener('change', async function() {
        if (!isAiReady) return;
        
        const code = this.value.trim();
        const studentName = danhSachLop[parseInt(code)-1] || "Học sinh " + code;
        const msgBox = document.getElementById('msgBox');
        
        // Chụp ảnh từ Video
        const video = document.getElementById('video');
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

        if (!detections) {
            showMsg("Không thấy mặt học sinh!", "danger");
            this.value = '';
            return;
        }

        // Lấy dữ liệu khuôn mặt cũ (nếu có)
        const savedDescriptor = localStorage.getItem('face_' + code);

        if (!savedDescriptor) {
            // ĐĂNG KÝ LẦN ĐẦU
            localStorage.setItem('face_' + code, JSON.stringify(Array.from(detections.descriptor)));
            showMsg("Đăng ký mặt thành công: " + studentName, "success");
            speak("Chào mừng " + studentName + " đã đăng ký");
        } else {
            // SO SÁNH KHUÔN MẶT
            const oldDescriptor = new Float32Array(JSON.parse(savedDescriptor));
            const distance = faceapi.euclideanDistance(detections.descriptor, oldDescriptor);

            if (distance < 0.5) { // Ngưỡng chính xác (càng nhỏ càng khó)
                showMsg("Điểm danh thành công: " + studentName, "success");
                speak("Chào " + studentName);
                addLog(code, studentName, "Hợp lệ ✅");
            } else {
                showMsg("CẢNH BÁO: SAI KHUÔN MẶT!", "danger");
                speak("Cảnh báo, sai khuôn mặt học sinh");
                addLog(code, studentName, "SAI MẶT ❌", true);
            }
        }
        this.value = '';
    });

    function showMsg(txt, type) {
        const box = document.getElementById('msgBox');
        box.innerText = txt;
        box.className = "alert-box alert-" + type;
        box.style.display = "block";
    }

    function addLog(stt, name, status, isDanger = false) {
        const list = document.getElementById('logList');
        const time = new Date().toLocaleTimeString();
        const row = `<tr style="${isDanger ? 'color:var(--danger)' : ''}">
            <td>${stt}</td><td><b>${name}</b></td><td>${time}</td><td>${status}</td>
        </tr>`;
        list.innerHTML = row + list.innerHTML;
    }

    loadAI();
</script>
</body>
</html>
