<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạnh Khang Digital - AI Pro 200</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --primary: #00ffcc; --bg: #0a0a0a; --card: #1c1c1c; --danger: #ff4d4d; --success: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .camera-wrapper { position: relative; width: 100%; max-width: 450px; margin: 0 auto; border: 3px solid #333; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .input-section { margin-top: 20px; text-align: center; }
        input[type="text"] { width: 90%; padding: 15px; background: #000; border: 2px solid var(--primary); color: var(--primary); border-radius: 12px; font-size: 24px; text-align: center; font-weight: bold; outline: none; }
        
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .log-table th { text-align: left; color: #666; padding: 10px; }
        .log-table td { padding: 12px 10px; border-bottom: 1px solid #222; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .bg-success { background: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid var(--success); }
        .bg-danger { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        #ai-status { font-size: 12px; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel" style="text-align: center;">
        <h2 style="color: var(--primary); margin: 0 0 15px; letter-spacing: 1px;">MẠNH KHANG DIGITAL AI</h2>
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="input-section">
            <input type="text" id="studentCode" placeholder="NHẬP SỐ BÁO DANH" autofocus inputmode="numeric">
            <span id="ai-status">🤖 Đang khởi động bộ não AI...</span>
        </div>
    </div>

    <div class="panel">
        <div class="log-header">
            <h3 style="margin:0">NHẬT KÝ ĐIỂM DANH</h3>
            <button class="btn-delete" onclick="clearLogs()">XÓA DỮ LIỆU</button>
        </div>
        <div style="overflow-x: auto;">
            <table class="log-table">
                <thead>
                    <tr><th>NGÀY</th><th>GIỜ</th><th>HỌ TÊN</th><th>TRẠNG THÁI</th></tr>
                </thead>
                <tbody id="logList"></tbody>
            </table>
        </div>
    </div>
</div>

    ];

    let isAiReady = false;

    // 1. KHỞI TẠO BỘ NÃO AI
    async function initAI() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        try {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);
            isAiReady = true;
            document.getElementById('ai-status').innerText = "✅ AI ĐÃ SẴN SÀNG QUÉT MẶT";
            startCamera();
            renderLogs();
        } catch (e) {
            document.getElementById('ai-status').innerText = "❌ Lỗi tải AI. Kiểm tra mạng hoặc HTTPS!";
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;
        } catch (err) {
            alert("Lỗi Camera: Anh Khang hãy cấp quyền camera cho app nhé!");
        }
    }

    // 2. GIỌNG NÓI CHÀO HỎI
    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        window.speechSynthesis.speak(msg);
    }

    // 3. QUẢN LÝ NHẬT KÝ (LƯU VÀO MÁY)
    function saveLog(stt, name, status, type) {
        let logs = JSON.parse(localStorage.getItem('khang_logs') || '[]');
        const now = new Date();
        logs.unshift({
            date: now.toLocaleDateString('vi-VN'),
            time: now.toLocaleTimeString('vi-VN'),
            stt: stt,
            name: name,
            status: status,
            type: type
        });
        localStorage.setItem('khang_logs', JSON.stringify(logs.slice(0, 500))); // Lưu tối đa 500 dòng
        renderLogs();
    }

    function renderLogs() {
        const list = document.getElementById('logList');
        const logs = JSON.parse(localStorage.getItem('khang_logs') || '[]');
        list.innerHTML = logs.map(l => `
            <tr>
                <td>${l.date}</td>
                <td>${l.time}</td>
                <td><b>${l.name}</b> (${l.stt})</td>
                <td><span class="status-badge bg-${l.type}">${l.status}</span></td>
            </tr>
        `).join('');
    }

    function clearLogs() {
        if(confirm("Anh Khang có muốn xóa sạch lịch sử điểm danh không?")) {
            localStorage.setItem('khang_logs', '[]');
            renderLogs();
        }
    }

    // 4. XỬ LÝ ĐIỂM DANH CHÍNH
    const input = document.getElementById('studentCode');
    input.addEventListener('change', async function() {
        if (!isAiReady) return;
        const code = this.value.trim();
        const index = parseInt(code) - 1;
        
        if (isNaN(index) || index < 0 || index >= 200) {
            alert("Số báo danh không tồn tại (1-200)!");
            this.value = '';
            return;
        }

        const name = danhSachLop[index];
        const video = document.getElementById('video');
        
        // Quét mặt thực tế
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
            speak("Không thấy mặt học sinh");
            alert("Vui lòng đứng thẳng trước camera!");
            this.value = '';
            return;
        }

        const savedFace = localStorage.getItem('khang_face_' + code);

        if (!savedFace) {
            // ĐĂNG KÝ MỚI
            localStorage.setItem('khang_face_' + code, JSON.stringify(Array.from(detection.descriptor)));
            saveLog(code, name, "ĐĂNG KÝ MỚI", "success");
            speak("Đã đăng ký khuôn mặt cho " + name);
            alert("Đã lưu mặt gốc cho: " + name);
        } else {
            // SO KHỚP AI
            const oldDescriptor = new Float32Array(JSON.parse(savedFace));
            const distance = faceapi.euclideanDistance(detection.descriptor, oldDescriptor);

            if (distance < 0.5) { // Độ chính xác 0.5 là tiêu chuẩn chuyên nghiệp
                saveLog(code, name, "HỢP LỆ ✅", "success");
                speak("Chào " + name);
            } else {
                saveLog(code, name, "SAI MẶT ❌", "danger");
                speak("Cảnh báo sai người");
                alert("CẢNH BÁO: Khuôn mặt không khớp với số báo danh " + code);
            }
        }
        this.value = '';
    });

    initAI();
</script>

</html>
