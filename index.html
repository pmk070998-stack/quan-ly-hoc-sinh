<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạnh Khang Digital - AI Pro 200</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        :root { --primary: #00ffcc; --bg: #0a0a0a; --card: #1c1c1c; --danger: #ff4d4d; --success: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
        .camera-wrapper { position: relative; width: 100%; max-width: 450px; margin: 0 auto; border: 3px solid #333; border-radius: 15px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .input-section { margin-top: 20px; text-align: center; }
        input[type="text"] { width: 90%; padding: 15px; background: #000; border: 2px solid var(--primary); color: var(--primary); border-radius: 12px; font-size: 24px; text-align: center; font-weight: bold; outline: none; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .log-table td { padding: 12px 10px; border-bottom: 1px solid #222; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .bg-success { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .bg-danger { background: rgba(255, 77, 77, 0.2); color: var(--danger); }
        #ai-status { font-size: 12px; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel" style="text-align: center;">
        <h2 style="color: var(--primary); margin: 0 0 15px;">MẠNH KHANG DIGITAL AI</h2>
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="input-section">
            <input type="text" id="studentCode" placeholder="NHẬP SỐ BÁO DANH" autofocus inputmode="numeric">
            <span id="ai-status">🤖 Đang tải bộ não AI...</span>
        </div>
    </div>

    <div class="panel">
        <div class="log-header">
            <h3 style="margin:0">NHẬT KÝ ĐIỂM DANH</h3>
            <button class="btn-delete" onclick="clearLogs()">XÓA DỮ LIỆU</button>
        </div>
        <table class="log-table">
            <tbody id="logList"></tbody>
        </table>
    </div>
</div>

<script>
    // TẠO NHANH 200 TÊN
    const danhSachLop = ["Phan Mạnh Khang", "Học sinh số 2", "Phạm Bá Gia Minh"];
    for (let i = 4; i <= 200; i++) danhSachLop.push("Học sinh số " + i);

    let isAiReady = false;

    async function initAI() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        try {
            // Tải bộ não AI
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            
            isAiReady = true;
            document.getElementById('ai-status').innerText = "✅ AI ĐÃ SẴN SÀNG";
            startCamera();
            renderLogs();
        } catch (e) {
            document.getElementById('ai-status').innerHTML = "<b style='color:red'>❌ LỖI: Hãy dùng link HTTPS (GitHub) để chạy!</b>";
        }
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = stream;
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        window.speechSynthesis.speak(msg);
    }

    function saveLog(stt, name, status, type) {
        let logs = JSON.parse(localStorage.getItem('khang_logs_v2') || '[]');
        const now = new Date();
        logs.unshift({
            time: now.toLocaleDateString('vi-VN') + " " + now.toLocaleTimeString('vi-VN'),
            stt: stt, name: name, status: status, type: type
        });
        localStorage.setItem('khang_logs_v2', JSON.stringify(logs.slice(0, 100)));
        renderLogs();
    }

    function renderLogs() {
        const logs = JSON.parse(localStorage.getItem('khang_logs_v2') || '[]');
        document.getElementById('logList').innerHTML = logs.map(l => `
            <tr>
                <td>${l.time}</td>
                <td><b>${l.name}</b></td>
                <td><span class="status-badge bg-${l.type}">${l.status}</span></td>
            </tr>
        `).join('');
    }

    function clearLogs() {
        if(confirm("Xóa lịch sử không anh Khang?")) {
            localStorage.setItem('khang_logs_v2', '[]');
            renderLogs();
        }
    }

    document.getElementById('studentCode').addEventListener('change', async function() {
        if (!isAiReady) return;
        const code = this.value.trim();
        const name = danhSachLop[parseInt(code)-1] || "Học sinh " + code;
        const video = document.getElementById('video');
        
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
            speak("Không thấy mặt");
            alert("Đứng thẳng trước camera anh nhé!");
            this.value = '';
            return;
        }

        const savedFace = localStorage.getItem('face_data_' + code);

        if (!savedFace) {
            localStorage.setItem('face_data_' + code, JSON.stringify(Array.from(detection.descriptor)));
            saveLog(code, name, "ĐĂNG KÝ MỚI", "success");
            speak("Đã đăng ký cho " + name);
        } else {
            const oldDescriptor = new Float32Array(JSON.parse(savedFace));
            const distance = faceapi.euclideanDistance(detection.descriptor, oldDescriptor);

            if (distance < 0.5) {
                saveLog(code, name, "HỢP LỆ ✅", "success");
                speak("Chào " + name);
            } else {
                saveLog(code, name, "SAI NGƯỜI ❌", "danger");
                speak("Cảnh báo sai người");
            }
        }
        this.value = '';
    });

    initAI();
</script>
</body>
</html>
